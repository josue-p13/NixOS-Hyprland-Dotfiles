# GRUVBOX HYPRLAND CONFIGURATION

# --- MONITORS ---
# See https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.cache/hypr/monitors.conf
# monitor=eDP-1,preferred,auto,1
# monitor=HDMI-A-2,1920x1080@144,auto,1

# --- AUTOSTART ---
# hypr-python es un wrapper NixOS que inyecta GI_TYPELIB_PATH automáticamente
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = awww-daemon & # Wallpaper daemon con soporte para persistencia y transiciones
exec-once = while true; do waybar; sleep 1; done &
exec-once = swaync &
exec-once = /home/josue/dotfiles/src/dashboard-qt/result/bin/dashboard-qt &
exec-once = hypr-python /home/josue/.config/hypr/scripts/gruvbox-osd.py &
exec-once = /home/josue/.config/hypr/hotcorner.sh &
exec-once = /home/josue/auto-gpu-login.sh &

# Cursor: el script auto-gpu.sh lo ajusta dinámicamente
exec-once = GTK_THEME=Adwaita:dark nwg-drawer -r -wm hyprland -s /home/josue/.config/nwg-drawer/drawer.css &
exec-once = hypr-python /home/josue/.config/hypr/scripts/gruvbox-dock.py &

# Autostart para servicios extra (gammastep, blueman-applet)
exec-once = gammastep &
exec-once = blueman-applet &
exec-once = easyeffects --daemon &


# --- ENVIRONMENT VARIABLES ---
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
# env = HYPRCURSOR_SIZE,24  ← DESACTIVADO: cursor del sistema, no el de Hyprland
# env = AQ_DRM_DEVICES gestionado por /home/josue/.config/hypr/scripts/hyprland-wrapper.sh
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

# Nvidia Multi-Monitor / Hybrid Fixes
# env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = WLR_NO_HARDWARE_CURSORS,1
# env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

cursor {
    no_hardware_cursors = true
    no_warps = true
}

# --- PLUGINS ---
# plugin = /home/josue/.config/hypr/plugins/hyprexpo.so
# plugin = /run/current-system/sw/lib/libhypr-dynamic-cursors.so

plugin:dynamic-cursors {
    enabled = true
    mode = tilt
    threshold = 2

    tilt {
        limit = 5000
        activation = negative_quadratic
        window = 100
        full = 60
    }

    rotate {
        length = 20
        offset = 0.0
    }

    stretch {
        limit = 3000
    }

    shake {
        enabled = true
        threshold = 6.0
        base = 4.0
        speed = 4.0
        timeout = 2000
    }
}
general { 
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # Gruvbox colors
    col.active_border = rgb(fe8019) rgb(fabd2f) 45deg
    col.inactive_border = rgb(3c3836)

    resize_on_border = true 
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 8
    
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
    
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Smooth bezier curves (Not too fast, not too slow)
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.4, 0.8, 0.2, 1.2

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 10, overshot, fade
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc { 
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 1
}

# --- INPUT ---
input {
    kb_layout = latam,es # Ajustado a teclado en español/LATAM
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Gestures (New syntax for 0.54.x)
gesture = 3, horizontal, workspace
# gesture = 3, up, dispatcher, hyprexpo:expo, toggle
# gesture = 3, down, dispatcher, hyprexpo:expo, toggle

# --- KEYBINDINGS ---
$mainMod = SUPER

# Applications
bindr = SUPER, SUPER_L, exec, pkill wofi || wofi --show drun
bind = $mainMod, Return, exec, /home/josue/dotfiles/src/nix-menu-qt/result/bin/nix-menu-qt
bind = $mainMod, T, exec, ghostty
bind = $mainMod, V, exec, bash /home/josue/.config/hypr/scripts/cliphist-menu.sh list
bind = $mainMod, Space, exec, nwg-drawer -wm hyprland -s /home/josue/.config/nwg-drawer/drawer.css
bind = $mainMod, P, exec, bash /home/josue/.config/hypr/scripts/power-menu.sh
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, S, exec, bash /home/josue/.config/hypr/scripts/toggle-floating.sh
bind = $mainMod, W, exec, /home/josue/dotfiles/src/wallpaper-carousel-qt/result/bin/wallpaper-carousel-qt
bind = $mainMod, D, exec, hypr-python /home/josue/.config/hypr/scripts/translate.py
bind = $mainMod, R, exec, pkill waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, left, exec, /home/josue/.config/hypr/scripts/animate_cursor l
bind = $mainMod, right, exec, /home/josue/.config/hypr/scripts/animate_cursor r
bind = $mainMod, up, exec, /home/josue/.config/hypr/scripts/animate_cursor u
bind = $mainMod, down, exec, /home/josue/.config/hypr/scripts/animate_cursor d

# Move active window with Super + Shift + arrows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Overview GNOME-style (hyprexpo)
# bindr = SUPER, SUPER_L, hyprexpo:expo, toggle

# Dock estilo GNOME
bind = $mainMod, B, exec, python3 -c "import os; fd=os.open('/tmp/gruvbox_dock_fifo',os.O_WRONLY); os.write(fd,b'toggle\n'); os.close(fd)"

# Ciclo de pantallas (Extender → Interna → Externa)
bind = $mainMod, C, exec, python3 /tmp/monitor-cycle.py

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Switch workspaces with Alt + Tab / Alt + Shift
bind = ALT, Tab, workspace, e+1
bind = ALT, Shift_L, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio/Media Controls
bind = ,XF86AudioRaiseVolume, exec, bash /home/josue/.config/hypr/scripts/osd-notify.sh vol-up
bind = ,XF86AudioLowerVolume, exec, bash /home/josue/.config/hypr/scripts/osd-notify.sh vol-down
bind = ,XF86AudioMute, exec, bash /home/josue/.config/hypr/scripts/osd-notify.sh vol-mute
bind = ,XF86MonBrightnessUp, exec, bash /home/josue/.config/hypr/scripts/osd-notify.sh bri-up
bind = ,XF86MonBrightnessDown, exec, bash /home/josue/.config/hypr/scripts/osd-notify.sh bri-down

# Screenshots (Estilo GNOME)
# Super + Shift + S: Seleccionar área, copiar y guardar en /home/josue/Imágenes/Capturas
bind = $mainMod SHIFT, S, exec, grimblast --notify copysave area /home/josue/Imágenes/Capturas/$(date +%Y-%m-%d_%H-%M-%S).png
# PrintScreen: Captura de pantalla completa, copiar y guardar en /home/josue/Imágenes/Capturas
bind = , Print, exec, grimblast --notify copysave screen /home/josue/Imágenes/Capturas/$(date +%Y-%m-%d_%H-%M-%S).png

# --- WINDOW RULES: Transparencia ---
# WhatsApp (Brave PWA)
windowrule {
    name = whatsapp-opacity
    match:class = ^(brave-hnpfjngllnobngcgfapefoaidbinmjnm-Default)$
    opacity = 0.92
}

# Spotify
windowrule {
    name = spotify-opacity
    match:class = ^(spotify|Spotify)$
    opacity = 0.8
}

# VSCode
windowrule {
    name = vscode-opacity
    match:class = ^(code|Code)$
    opacity = 0.92
}

# YouTube Music (Pear Desktop)
windowrule {
    name = ytmusic-opacity
    match:class = ^(pear-desktop)$
    opacity = 0.92
}

# Discord
windowrule {
    name = discord-opacity
    match:class = ^(discord)$
    opacity = 0.92
}

# Nautilus (File Explorer)
windowrule {
    name = nautilus-opacity
    match:class = ^(org.gnome.Nautilus|nautilus)$
    opacity = 0.92
}

# Zed Editor
windowrule {
    name = zed-opacity
    match:class = ^(zed|Zed|dev.zed.Zed)$
    opacity = 0.92
}


# Traductor (Floating and Centered)
windowrule {
    name = translation
    float = true
    center = true
    stay_focused = true
    match:title = ^(Traducción)$
}

# Wallpaper Carousel (Qt6)
windowrule = match:class ^(wallpaper-carousel-qt)$, float 1
windowrule = match:class ^(wallpaper-carousel-qt)$, border_size 0
windowrule = match:class ^(wallpaper-carousel-qt)$, stay_focused 1

# Nix Menu (Qt6)
windowrule = match:class ^(nix-menu-qt)$, float 1
windowrule = match:class ^(nix-menu-qt)$, border_size 0
windowrule = match:class ^(nix-menu-qt)$, stay_focused 1

# Unified Dashboard (Qt6/QML) - Desenfoque para el widget de fondo
layerrule = blur 1, match:namespace ^(dashboard-qt)$

